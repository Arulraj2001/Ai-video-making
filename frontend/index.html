    <!-- ═══════════════════════════════════════════════════
         THEME FLASH PREVENTION (must be inline, before body)
    ═══════════════════════════════════════════════════ -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('scenora_theme') || localStorage.getItem('ai_video_theme');
          var theme = saved;
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

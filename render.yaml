services:
  - type: web
    name: ai-video-maker-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://ai-video-maker.netlify.app,http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.netlify\.app
      - key: DEFAULT_ASPECT_RATIO
        value: 16:9
      - key: LLM_PROVIDER
        value: mock
      - key: IMAGE_GENERATOR_PROVIDER
        value: mock
